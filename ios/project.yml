name: BayCountyMe
options:
  bundleIdPrefix: me.baycounty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "11"   # bump on every TestFlight upload (10 is the last that may have been uploaded); About shows it
    DEVELOPMENT_TEAM: Q8EM9CLKCK   # Flux Labs
    CODE_SIGN_STYLE: Automatic
packages:
  BayCountyKit:
    path: BayCountyKit
targets:
  BayCountyMe:
    type: application
    platform: iOS
    sources:
      - path: BayCountyMe
    dependencies:
      - package: BayCountyKit
    entitlements:
      # Phone alerts (Emergencies screen). Apple's push service needs the Push Notifications capability on the
      # me.baycounty.app identifier; automatic signing adds it. The server sends with APNS_* keys (api/_push.js).
      path: BayCountyMe/BayCountyMe.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: BayCountyMe/Info.plist
      properties:
        CFBundleDisplayName: BayCounty.me
        # XcodeGen otherwise writes a fixed 1.0 (1), ignoring the version and build settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Canvas
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes: [maps, webcal]
        UIBackgroundModes: [remote-notification]
        NSLocationWhenInUseUsageDescription: "BayCounty.me uses your location once, when you tap Use my location, to find your address on Bay County's public map. It isn't stored or shared."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.baycounty.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  # BayCounty.me Staff: the government workspace for city and county staff and the site owner (api/gov.js).
  # Separate from the resident app so residents never download staff screens. Shares BayCountyKit.
  BayCountyStaff:
    type: application
    platform: iOS
    sources:
      - path: BayCountyStaff
      - path: BayCountyMe/Views/AlertMapView.swift
    dependencies:
      - package: BayCountyKit
    info:
      path: BayCountyStaff/Info.plist
      properties:
        CFBundleDisplayName: BC Staff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Canvas
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: "BayCounty.me Staff locks after 5 minutes away, because it can send alerts to residents' phones. Face ID unlocks it."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.baycounty.staff
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  BayCountyMeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BayCountyMeUITests
    dependencies:
      - target: BayCountyMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.baycounty.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  BayCountyMe:
    build:
      targets:
        BayCountyMe: all
    run:
      config: Debug
    test:
      targets:
        - package: BayCountyKit/BayCountyKitTests
        - BayCountyMeUITests
  BayCountyStaff:
    build:
      targets:
        BayCountyStaff: all
    run:
      config: Debug
