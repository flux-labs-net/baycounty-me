name: BayCountyMe
options:
  bundleIdPrefix: me.baycounty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "11"   # local builds only. The iOS release workflow sets its own build number (run number + 100); a local TestFlight archive must go higher than the last one uploaded. About shows it
    DEVELOPMENT_TEAM: Q8EM9CLKCK   # Flux Labs
    CODE_SIGN_STYLE: Automatic
packages:
  BayCountyKit:
    path: BayCountyKit
targets:
  BayCountyMe:
    type: application
    platform: iOS
    sources:
      - path: BayCountyMe
    dependencies:
      - package: BayCountyKit
    entitlements:
      # Phone alerts (Emergencies screen). Apple's push service needs the Push Notifications capability on the
      # me.baycounty.app identifier; automatic signing adds it. The server sends with APNS_* keys (api/_push.js).
      path: BayCountyMe/BayCountyMe.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: BayCountyMe/Info.plist
      properties:
        CFBundleDisplayName: BayCounty.me
        # XcodeGen otherwise writes a fixed 1.0 (1), ignoring the version and build settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Canvas
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes: [maps, webcal]
        UIBackgroundModes: [remote-notification]
        NSLocationWhenInUseUsageDescription: "BayCounty.me uses your location once, when you tap Use my location, to find your address on Bay County's public map. It isn't stored or shared."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.baycounty.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  BayCountyMeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BayCountyMeUITests
    dependencies:
      - target: BayCountyMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.baycounty.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  BayCountyMe:
    build:
      targets:
        BayCountyMe: all
    run:
      config: Debug
    test:
      targets:
        - package: BayCountyKit/BayCountyKitTests
        - BayCountyMeUITests
