name: BayCountyMe
options:
  bundleIdPrefix: me.baycounty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # your Apple Developer Team ID
packages:
  BayCountyKit:
    path: BayCountyKit
targets:
  BayCountyMe:
    type: application
    platform: iOS
    sources:
      - path: BayCountyMe
    dependencies:
      - package: BayCountyKit
    info:
      path: BayCountyMe/Info.plist
      properties:
        CFBundleDisplayName: BayCounty.me
        UILaunchScreen:
          UIColorName: Canvas
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes: [maps, webcal]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.baycounty.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  BayCountyMe:
    build:
      targets:
        BayCountyMe: all
    run:
      config: Debug
    test:
      targets:
        - package: BayCountyKit/BayCountyKitTests
