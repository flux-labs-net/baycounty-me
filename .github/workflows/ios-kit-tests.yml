name: iOS data layer tests
on:
  push:
    paths: ["ios/**", "site/public/downloads/**"]
  pull_request:
    paths: ["ios/**", "site/public/downloads/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Test BayCountyKit against the published data
        working-directory: ios/BayCountyKit
        run: swift test
