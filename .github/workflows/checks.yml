# Runs the serverless function tests (api/__tests__) on every pull request and every push to main,
# and applies every db/migrations/*.sql file in order to an empty Postgres so a broken migration fails here, not in the production sync.
# A throwaway Postgres lets the finance API tests apply migration 0015 and run files end to end.
# Pull requests are merged only after this check is green.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financetest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINANCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financetest
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Screenshot picker picks the right app screens
        run: python3 -m unittest discover -s .github/scripts
      - name: Contract dollars behind officials' votes (site/vote_dollars.py rules)
        run: python3 -m unittest discover -s site -p 'test_*.py'
  migrations:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrationtest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]>=3.2'
      - name: Apply all migrations to an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrationtest
        run: python db/scripts/check_migrations.py
