name: iOS app build
on:
  push:
    branches: [main]   # pull requests are built by the pull_request trigger; don't build every branch push twice
    paths: ["ios/**", ".github/workflows/ios-app-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-app-build.yml"]
jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the full Xcode, not the Command Line Tools
        run: |
          if [ -d /Applications/Xcode.app ]; then echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else echo "::error::Xcode isn't installed on this Mac (only the Command Line Tools, which have no simulator). Install Xcode from the App Store."; exit 1; fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen
      - name: Build the app (simulator, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BayCountyMe.xcodeproj -scheme BayCountyMe \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*(deprecated|unreachable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build the staff app (simulator, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BayCountyMe.xcodeproj -scheme BayCountyStaff \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee staff.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" staff.log
