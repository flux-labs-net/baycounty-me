# Refresh the meetings calendar and candidates' campaign finance reports every morning, then rebuild the site.
# Pushing to main triggers the normal Vercel deploy. Commits only when something changed.
# Problems (failed fetch, new source errors, failed push) email the admins: secrets RESEND_FULL_KEY and ADMIN_EMAILS.
name: Refresh meetings
on:
  schedule:
    - cron: '17 11 * * *'   # 11:17 UTC: 6:17 a.m. CDT, 5:17 a.m. CST (GitHub cron is always UTC)
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  actions: write   # start the database sync after a push (bot-started runs don't trigger workflow_run)
concurrency:
  # Shared with refresh-weekly.yml: both push to main, so they take turns. Never cancel a run that may have pushed.
  group: main-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch meetings
        id: fetch_meetings
        working-directory: data/meetings
        run: python fetch_meetings.py
      - name: Report meeting source errors
        id: meeting_source_errors
        # When meetings.json lists errors, this step fails (red X and an error annotation on the run) and opens one
        # issue, or comments on the open one. continue-on-error keeps the rest of the refresh (and the database sync,
        # which only follows a successful run) going, since one broken source shouldn't hold back the others.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(python -c "import json;print(len(json.load(open('data/meetings/meetings.json')).get('errors') or []))")
          title="Meetings refresh: source errors"
          if [ "$n" = "0" ]; then
            echo "No meeting source errors"
            # Close the open issue so the next new error opens a fresh one (and emails the admins again).
            num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty' || true)
            if [ -n "$num" ]; then gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "All meeting sources answered on this run." || true; fi
            exit 0
          fi
          python - > "$RUNNER_TEMP/body.md" <<'PY'
          import json, os
          e = json.load(open('data/meetings/meetings.json'))['errors']
          print(f"The daily meetings refresh reported {len(e)} source error(s).\n")
          for x in e:
              print(f"- **{x.get('board')}** ({x.get('source')}): {x.get('error')}  \n  {x.get('url')}")
          print(f"\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          PY
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty' || true)
          # Admins are emailed when the issue is first opened; daily repeats only add a comment (notify=false).
          if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"; echo "notify=false" >> "$GITHUB_OUTPUT"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"; fi
          echo "::error title=Meeting sources::meetings.json has $n source error(s); see the open issue."
          exit 1
      - name: Fetch campaign finance reports
        id: fetch_campaign_finance
        continue-on-error: true
        working-directory: data/elections/scripts
        env:
          # keys the public business-owner ids (data/campaign/owner_gifts.py); without it owner gifts aren't updated
          OWNER_ID_KEY: ${{ secrets.OWNER_ID_KEY }}
        run: |
          if [ -z "$OWNER_ID_KEY" ]; then echo "alert=The OWNER_ID_KEY repository secret is missing, so business-owner gifts were not updated." >> "$GITHUB_OUTPUT"; fi
          ./refresh.sh "$RUNNER_TEMP/soe"
      - name: Fetch restaurant inspections
        # The state's current-year inspection file and license list (DBPR). A failure keeps yesterday's rows.
        continue-on-error: true
        run: python data/restaurants/fetch_dbpr.py
      - name: Fetch chamber events
        # The PCB Chamber's public calendar feed. A failure keeps yesterday's events and records the error.
        continue-on-error: true
        run: python data/chambers/fetch_events.py
      - name: Fetch community events
        # County and city calendars, the library system, visitor bureaus and the PCB Chamber (after the chamber fetch,
        # which it reads). A failed source keeps yesterday's events.
        continue-on-error: true
        run: python data/events/fetch_events.py
      - name: Fetch beach conditions, water quality and parks
        continue-on-error: true
        run: python3 data/outdoors/fetch_outdoors.py
      - name: Fetch the school district calendar
        # Bay District Schools' website events feed: no-school days, early release, grading periods, graduations and
        # School Board meetings. A failure keeps the events on file and records the error.
        continue-on-error: true
        run: python data/schools/fetch_schools.py --only calendar
      - name: Fetch emergency data
        # Shelters, the evacuation zone shapes and the day's emergency notices (data/emergency/bay/). The live list is
        # checked every 5 minutes by the site itself; this keeps the downloadable archive. A failure keeps yesterday's files.
        continue-on-error: true
        run: node data/emergency/fetch_emergency.js
      - name: Fetch election results
        # Every Bay County election since 2016 (data/elections/scripts/fetch_results.py). Elections from the last 60 days
        # are read again; a failure keeps the file as it was.
        continue-on-error: true
        run: python data/elections/scripts/fetch_results.py
      - name: Fetch voting dates and polling places
        continue-on-error: true
        run: python data/elections/scripts/fetch_voting.py
      - name: Set up a browser for notices and jobs
        # The public notice site and several job boards only show their lists in a browser.
        id: browser
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Fetch public notices
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        run: |
          node data/notices/fetch_notices.js > "$RUNNER_TEMP/notices_raw.json"
          python data/notices/build_notices.py "$RUNNER_TEMP/notices_raw.json"
      - name: Fetch government job openings
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        run: node data/jobs/fetch_jobs.js
      - name: Fetch open volunteer needs
        # United Way of Northwest Florida's volunteer center and Idealist. A failed board keeps its needs on file until they close.
        continue-on-error: true
        run: python data/volunteer/fetch_needs.py
      - name: Fetch military news
        # DVIDS feeds for the units at Tyndall AFB and NSA Panama City. Stories already on file are kept if a feed fails.
        continue-on-error: true
        run: python data/military/fetch_news.py
      - name: Check campaign finance freshness
        # refresh.sh keeps the old file when the Elections Office site is down, so a long outage would be silent.
        id: finance_freshness
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json, datetime as d
          a = d.date.fromisoformat(json.load(open('data/elections/finance_2026.json'))['as_of'][:10])
          age = (d.date.today() - a).days
          if age > 3:
              print(f"alert=Campaign finance data is {age} days old: the Elections Office fetch keeps failing or finding nothing.")
          PY
      - name: Export agenda items for search
        # Items read from posted agendas (data/agendas/export_items.py). A database problem keeps the last export.
        id: export_agenda_items
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_REGION: ${{ vars.SUPABASE_REGION || 'us-east-2' }}
        run: |
          pip install -q 'psycopg[binary]'
          python data/agendas/export_items.py
      - name: Export votes read from minutes
        # Motions read from official minutes that passed every check or were approved on /admin
        # (data/minutes/export_votes.py). A database problem keeps the last export.
        id: export_minutes_votes
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_REGION: ${{ vars.SUPABASE_REGION || 'us-east-2' }}
        run: |
          pip install -q 'psycopg[binary]'
          python data/minutes/export_votes.py
      - name: Export name-match decisions
        # Look-alike business names an admin confirmed or kept apart on /admin > Name matches
        # (data/entities/export_name_decisions.py); the rebuild below applies them. A database problem keeps the last export.
        id: export_name_decisions
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_REGION: ${{ vars.SUPABASE_REGION || 'us-east-2' }}
        run: |
          pip install -q 'psycopg[binary]'
          python data/entities/export_name_decisions.py
      - name: Rebuild derived datasets
        # People, vendor matches, contract votes, Sunbiz donor links and nonprofit links are built from the files
        # fetched above (data/build.py). Without this, new candidates and gifts got no profile until someone rebuilt.
        id: rebuild_derived
        run: |
          pip install -q shapely
          cd data && python build.py > /dev/null && python prep_dash.py > /dev/null
      - name: Rebuild site
        id: rebuild_site
        working-directory: site
        run: python build_site.py > /dev/null
      - name: SEO check
        working-directory: site
        run: |
          if ! python seo_audit.py > "$RUNNER_TEMP/seo.txt"; then echo "::warning title=SEO check::seo_audit.py found errors; see the log"; fi
          tail -25 "$RUNNER_TEMP/seo.txt"
      - name: Commit if changed
        id: commit_and_push
        run: |
          src="data/meetings data/elections/finance_2026.json data/campaign/owner_gifts.json data/agendas/agenda_items.json data/votes/minutes_votes.json data/entities/name_decisions.json data/dupes data/chambers/bay/events.json data/events/bay/events.json data/outdoors/bay data/schools/bay/calendar.json data/emergency data/elections/results.json data/elections/voting.json data/notices/bay/notices.json data/jobs/bay/jobs.json data/restaurants/bay data/volunteer/bay/needs.json data/military/bay/news.json"
          # git status --porcelain also lists new, untracked files, which git diff --quiet ignores.
          if [ -z "$(git status --porcelain -- data site/public)" ]; then echo "No changes"; exit 0; fi
          .github/scripts/push_refresh.sh "Daily refresh: meetings, agenda items, votes from minutes, campaign finance, elections, notices, jobs and emergency notices ($(date -u +%Y-%m-%d))" $src
      - name: Deploy the refresh to Vercel
        # Vercel blocks Git deploys of commits whose author isn't on the Vercel team, which includes this bot's commits.
        # A deploy hook (Vercel > Project > Settings > Git > Deploy Hooks, branch main) builds main regardless; store
        # its URL as the repository secret VERCEL_DEPLOY_HOOK. Skipped when nothing was pushed or the secret isn't set.
        if: steps.commit_and_push.outputs.pushed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning title=Vercel::VERCEL_DEPLOY_HOOK isn't set, so this refresh waits for the next merge to deploy."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Vercel deploy started"
      - name: Sync the database
        # sync-db.yml's push trigger doesn't fire for this bot's pushes, so start it here.
        if: steps.commit_and_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-db.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Email admins about problems
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          RESEND_KEY: ${{ secrets.RESEND_FULL_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          EXTRA_FILE: ${{ runner.temp }}/body.md
        run: python3 .github/scripts/notify_admins.py
