# Read the Florida Department of Education's school grades and per-school spending files for a branch, and commit the
# results to that branch (data/schools/<county>/grades.json and spending.json). fldoe.org turns some cloud servers
# away, so this runs on GitHub's runners. On main, the weekly refresh (refresh-weekly.yml) does the same fetch.
# Runs when the fetch scripts change on a branch, or by hand (Actions > Fetch school data > Run workflow).
name: Fetch school data
on:
  push:
    branches-ignore: [main]
    paths:
      - 'data/schools/fetch_fldoe.py'
      - 'data/schools/fetch_schools.py'
      - '.github/workflows/fetch-schools.yml'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch-schools-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q openpyxl xlrd
      - name: School grades and per-school spending (fldoe.org)
        continue-on-error: true
        run: python data/schools/fetch_fldoe.py
      - name: Schools, zones and calendar
        continue-on-error: true
        run: python data/schools/fetch_schools.py
      - name: Commit to this branch if changed
        run: |
          if [ -z "$(git status --porcelain -- data/schools)" ]; then echo "No changes"; exit 0; fi
          git config user.name "BayCounty.me bot"
          git config user.email "211150+jeremymcs@users.noreply.github.com"
          git add -A data/schools
          git commit -qm "School data from the state and district ($(date -u +%Y-%m-%d))"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
