# Weekly refresh of sources that change slowly: Hurricane Michael FEMA Public Assistance projects (OpenFEMA, no key)
# the county's half-cent sales tax project map (Bay County GIS), development projects and new-home permits
# (county planning maps, Census Building Permits Survey) and state road contracts and work program (FDOT GIS). Rebuilds the site and commits only when
# something changed; pushing to main triggers the normal Vercel deploy, and sync-db.yml runs after this workflow.
# Same pattern as refresh-meetings.yml. Each fetch keeps the existing file if its source fails or returns nothing.
# Any failure emails the admins (ADMIN_EMAILS secret) through .github/scripts/notify_admins.py.
name: Refresh weekly sources
on:
  schedule:
    - cron: '41 11 * * 2'   # Tuesdays 11:41 UTC: 6:41 a.m. CDT, 5:41 a.m. CST
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write   # start the database sync after a push
concurrency:
  # Shared with refresh-meetings.yml: both push to main, so they take turns.
  group: main-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install shapely
      - name: Fetch FEMA Public Assistance ledger (OpenFEMA)
        id: fetch_fema_ledger
        continue-on-error: true
        working-directory: data/michael
        run: python build_ledger.py < /dev/null
      - name: Fetch sales tax project map (Bay County GIS)
        id: fetch_sales_tax_map
        continue-on-error: true
        working-directory: data/surtax
        run: python fetch_gis.py < /dev/null
      - name: Fetch development projects and new-home permits (planning maps, Census)
        id: fetch_development
        continue-on-error: true
        run: python data/development/fetch.py < /dev/null
      - name: Fetch state road contracts and work program (FDOT GIS)
        id: fetch_roads
        continue-on-error: true
        run: python data/roads/fetch_fdot.py < /dev/null
      - name: Fetch public schools and attendance zones
        # The school directory and enrollment (U.S. Dept. of Education via the Urban Institute) and the attendance
        # zones (Bay County GIS). School grades and per-school spending come from fldoe.org, which turns cloud servers
        # away, so data/schools/fetch_fldoe.py runs by hand once a year when grades come out (July).
        id: fetch_schools
        continue-on-error: true
        run: python data/schools/fetch_schools.py --only directory,zones < /dev/null
      - name: Fetch disaster declarations and rebuild money by ZIP (OpenFEMA)
        id: fetch_fema_rebuild
        continue-on-error: true
        run: python data/emergency/fetch_fema.py < /dev/null
      - name: Fetch federal contracts to local companies (USAspending)
        id: fetch_federal_contracts
        continue-on-error: true
        # Writes the file only after every page has loaded, so a failure keeps last week's contracts.
        run: python data/military/fetch_contracts.py < /dev/null
      - name: Fetch crime counts and police staffing (FBI Crime Data Explorer)
        id: fetch_crime
        continue-on-error: true
        # An agency that fails keeps what was on file.
        run: python data/safety/fetch_cde.py < /dev/null
      - name: Report fetch failures
        if: steps.fetch_fema_ledger.outcome == 'failure' || steps.fetch_sales_tax_map.outcome == 'failure' || steps.fetch_development.outcome == 'failure' || steps.fetch_roads.outcome == 'failure' || steps.fetch_schools.outcome == 'failure' || steps.fetch_fema_rebuild.outcome == 'failure' || steps.fetch_federal_contracts.outcome == 'failure' || steps.fetch_crime.outcome == 'failure'
        run: |
          echo "::warning title=Weekly refresh::FEMA fetch: ${{ steps.fetch_fema_ledger.outcome }}; GIS fetch: ${{ steps.fetch_sales_tax_map.outcome }}; development: ${{ steps.fetch_development.outcome }}; roads: ${{ steps.fetch_roads.outcome }}; schools fetch: ${{ steps.fetch_schools.outcome }}; FEMA rebuild money: ${{ steps.fetch_fema_rebuild.outcome }}; USAspending fetch: ${{ steps.fetch_federal_contracts.outcome }}; FBI crime data: ${{ steps.fetch_crime.outcome }}. The previous files were kept."
      - name: Rebuild site
        id: rebuild_site
        run: |
          cd data && python build.py && python prep_dash.py
          cd ../site && python build_site.py > /dev/null
      - name: SEO check
        working-directory: site
        run: |
          if ! python seo_audit.py > "$RUNNER_TEMP/seo.txt"; then echo "::warning title=SEO check::seo_audit.py found errors; see the log"; fi
          tail -25 "$RUNNER_TEMP/seo.txt"
      - name: Commit if changed
        id: commit_and_push
        run: |
          # Commit whenever the rebuild changed anything, not only the two fetched files: data/build.py also
          # rebuilds people, vendor matches and other derived files from the daily inputs.
          if [ -z "$(git status --porcelain -- data site/public)" ]; then echo "No changes"; exit 0; fi
          .github/scripts/push_refresh.sh "Weekly refresh: FEMA projects, sales tax map, development, roads, schools, crime counts and derived data ($(date -u +%Y-%m-%d))" data/michael/pa_ledger.json data/surtax/gis_projects.json data/development/bay/projects.json data/development/bay/permits.json data/roads/bay/fdot.json data/schools/bay/schools.json data/schools/bay/zones.json data/military/bay/federal_contracts.json data/safety/bay/fbi.json
      - name: Deploy the refresh to Vercel
        # Vercel blocks Git deploys of commits whose author isn't on the Vercel team, which includes this bot's commits.
        # A deploy hook (Vercel > Project > Settings > Git > Deploy Hooks, branch main) builds main regardless; store
        # its URL as the repository secret VERCEL_DEPLOY_HOOK. Skipped when nothing was pushed or the secret isn't set.
        if: steps.commit_and_push.outputs.pushed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning title=Vercel::VERCEL_DEPLOY_HOOK isn't set, so this refresh waits for the next merge to deploy."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Vercel deploy started"
      - name: Sync the database
        if: steps.commit_and_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-db.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Email admins about problems
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          RESEND_KEY: ${{ secrets.RESEND_FULL_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: python3 .github/scripts/notify_admins.py
