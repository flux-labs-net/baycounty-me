name: Android
# Builds the Android app (android/) when it changes: kit tests and debug APKs, plus pictures of the screens the change
# touched, as proof: rendered on the JVM in light and dark (Paparazzi, from the data in this repo) and on a real
# emulator with live data. .github/scripts/app_screens.py picks the screens from the changed files, or from a
# "Screens: taxbill, home" line in the pull request description; the all-screens label or a manual run (screens: all)
# takes every screen. Download the APKs and pictures from the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Screens to take: "all", or names like "taxbill home staff watch" (staff / watch = those apps)'
        default: all
  pull_request:
    paths: ["android/**", "site/public/data/app/**", ".github/workflows/android.yml", ".github/scripts/app_screens.py",
            ".github/actions/pick-screens/**"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  plan:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      android: ${{ steps.pick.outputs.android }}
      any_android: ${{ steps.pick.outputs.any_android }}
      emu: ${{ steps.pick.outputs.android_emu }}
      emu_dark: ${{ steps.pick.outputs.android_emu_dark }}
      any_emu: ${{ steps.pick.outputs.any_android_emu }}
      staff: ${{ steps.pick.outputs.staff }}
      watch: ${{ steps.pick.outputs.watch }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: pick
        uses: ./.github/actions/pick-screens
        with:
          manual: ${{ inputs.screens }}

  build:
    needs: plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kit tests and debug APK
        run: ./gradlew :kit:test :app:assembleDebug
      - name: Render the picked screens, light and dark
        if: needs.plan.outputs.any_android == 'true'
        env:
          SCREENS: ${{ needs.plan.outputs.android }}
        run: ./gradlew :app:testDebugUnitTest --tests 'me.baycounty.app.ScreensTest' -Dscreens="$SCREENS" -Dfullres="$PWD/shots"
      - name: Staff app (BayCounty.me Staff) and Wear OS app, debug APKs
        run: ./gradlew :staff:assembleDebug :wear:assembleDebug
      - name: Staff app screens, light and dark, when it changed
        if: needs.plan.outputs.staff == 'true'
        run: ./gradlew :staff:testDebugUnitTest -Dfullres="$PWD/staff-shots"
      - name: Wear OS app screens (made-up demo day), when it changed
        if: needs.plan.outputs.watch == 'true'
        run: ./gradlew :wear:testDebugUnitTest -Dfullres="$PWD/wear-shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wear-screens
          path: android/wear-shots
      - uses: actions/upload-artifact@v4
        with:
          name: wear-apk-debug
          path: android/wear/build/outputs/apk/debug/wear-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-screens
          path: android/staff-shots
      - uses: actions/upload-artifact@v4
        with:
          name: staff-apk-debug
          path: android/staff/build/outputs/apk/debug/staff-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-jvm
          path: android/shots

  emulator:
    needs: [plan, build]
    if: needs.plan.outputs.any_emu == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
      - name: Free disk space for the emulator
        # The emulator's data partition needs about 7.4 GB; a stock runner can come up a few MB short.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /home/runner
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/scripts/emulator_shots.sh app-debug.apk emulator-shots
        env:
          SHOTS: ${{ needs.plan.outputs.emu }}
          DARK_SHOTS: ${{ needs.plan.outputs.emu_dark }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-emulator
          path: emulator-shots
