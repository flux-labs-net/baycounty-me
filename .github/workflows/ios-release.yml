name: iOS release
# Builds a signed App Store build and uploads it to App Store Connect, where it shows up in TestFlight.
# Two ways to run it:
#   - By hand: Actions > iOS release > Run workflow. Untick "upload" to only build the .ipa.
#   - A version tag: pushing a tag like v1.2.0 builds version 1.2.0 and uploads it. The same tag starts the Android release.
# Sending a build to App Store review stays a step you take in App Store Connect.
# Needs the repository secrets in ios/README.md (Releasing from GitHub). The build number is this workflow's run
# number plus 100, so every upload has a new one. Nothing here runs on an ordinary push.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect / TestFlight
        type: boolean
        default: true
      runner:
        description: Where to build ("macpro" is the self-hosted Mac Pro runner)
        type: choice
        default: blacksmith
        options: [blacksmith, macpro]
  push:
    tags: ['v*']
concurrency:
  group: ios-release
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ${{ fromJSON(inputs.runner == 'macpro' && '["self-hosted","macpro"]' || '"blacksmith-6vcpu-macos-15"') }}
    timeout-minutes: 45
    env:
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      TEAM_ID: Q8EM9CLKCK
      BUNDLE_ID: me.baycounty.app
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in P12 P12_PASSWORD PROFILE; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ "$UPLOAD" = "true" ]; then for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || missing="$missing $v"; done; fi
          if [ -n "$missing" ]; then
            echo "Missing secrets:$missing (P12 = IOS_DIST_CERT_P12_BASE64, P12_PASSWORD = IOS_DIST_CERT_PASSWORD, PROFILE = IOS_PROFILE_BASE64). See ios/README.md."
            exit 1
          fi
      - name: Pick Xcode
        # App Store Connect only takes builds made with a recent SDK. On Blacksmith use the newest non-beta Xcode;
        # on the Mac Pro keep the one picked with xcode-select.
        run: |
          dev=""
          if [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then dev=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -vi beta | sort -V | tail -1); fi
          if [ -n "$dev" ]; then echo "DEVELOPER_DIR=$dev/Contents/Developer" >> "$GITHUB_ENV"; export DEVELOPER_DIR="$dev/Contents/Developer"; fi
          xcodebuild -version
      - name: Version
        run: |
          build=$((${{ github.run_number }} + 100))
          version=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "MARKETING=$version" >> "$GITHUB_ENV"
          echo "Build $build, version ${version:-from project.yml}, upload: $UPLOAD" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the signing certificate
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          kcpass=$(uuidgen)
          echo "$P12" | base64 -D > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # Keep the machine's own keychains (the Mac Pro's login keychain) in the search list, with ours first.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "RELEASE_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$kc"
      - name: Install the provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE" | base64 -D > "$RUNNER_TEMP/release.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/release.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          name=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          expires=$(plutil -extract ExpirationDate raw "$RUNNER_TEMP/profile.plist")
          echo "Profile \"$name\" ($uuid), expires $expires"
          # Xcode 16+ reads the first folder, older Xcode the second.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/release.mobileprovision" "$d/$uuid.mobileprovision"
          done
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate the Xcode project (release signing)
        # Release signing goes on the app target only. Passing it to xcodebuild would also hit the BayCountyKit
        # package, which can't take a provisioning profile. Push alerts use Apple's production service in store builds.
        run: |
          perl -0pi -e 's/aps-environment: development/aps-environment: production/' project.yml
          perl -0pi -e 's/(\n( +)PRODUCT_BUNDLE_IDENTIFIER: me\.baycounty\.app\n)/$1$2CODE_SIGN_STYLE: Manual\n$2CODE_SIGN_IDENTITY: "Apple Distribution"\n$2PROVISIONING_PROFILE_SPECIFIER: "$ENV{PROFILE_UUID}"\n/' project.yml
          grep -q "PROVISIONING_PROFILE_SPECIFIER" project.yml || { echo "Couldn't add release signing to project.yml"; exit 1; }
          xcodegen
      - name: Archive
        run: |
          set -o pipefail
          extra=()
          if [ -n "$MARKETING" ]; then extra+=("MARKETING_VERSION=$MARKETING"); fi
          xcodebuild -project BayCountyMe.xcodeproj -scheme BayCountyMe -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/BayCountyMe.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" OTHER_CODE_SIGN_FLAGS="--keychain $RELEASE_KEYCHAIN" "${extra[@]}" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/BayCountyMe.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" | tail -20
          ls "$RUNNER_TEMP/export"/*.ipa
          cp "$RUNNER_TEMP/export"/*.ipa "$RUNNER_TEMP/BayCountyMe-$BUILD_NUMBER.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ runner.temp }}/BayCountyMe-*.ipa
      - name: Upload to App Store Connect
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keys="$RUNNER_TEMP/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$ASC_KEY_P8" > "$keys/AuthKey_$ASC_KEY_ID.p8"
          API_PRIVATE_KEYS_DIR="$keys" xcrun altool --upload-app -t ios -f "$RUNNER_TEMP/BayCountyMe-$BUILD_NUMBER.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          rm -rf "$keys"
          echo "Uploaded build $BUILD_NUMBER. It shows in TestFlight once App Store Connect finishes processing (usually 5 to 30 minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up signing files
        # Matters on the self-hosted Mac Pro, which keeps its disk between runs.
        if: always()
        run: |
          if [ -n "$RELEASE_KEYCHAIN" ]; then
            security list-keychains -d user -s $(security list-keychains -d user | tr -d '"' | grep -v "$RELEASE_KEYCHAIN")
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          if [ -n "$PROFILE_UUID" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/release.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/dist.p12"
