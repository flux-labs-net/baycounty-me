name: iOS screenshots
# Runs the app in the iPhone simulator and screenshots the screens a pull request changed, as proof of the change.
# .github/scripts/app_screens.py picks them from the changed files (HomeView.swift -> home, and so on), or from a
# "Screens: taxbill, home" line in the pull request description. The all-screens label or a manual run (screens: all)
# takes every screen, for a release. When no screen changed, the Mac isn't used at all.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Screens to take: "all", or names like "taxbill home staff" (staff = the staff app)'
        default: all
  pull_request:
    paths: ["ios/BayCountyMe/**", "ios/BayCountyKit/Sources/**", "ios/BayCountyStaff/**",
            ".github/workflows/ios-screenshots.yml", ".github/scripts/app_screens.py", ".github/actions/pick-screens/**"]
# One Mac runs every iOS job one at a time, so a new push to a pull request cancels that PR's older run
# instead of queuing behind it. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Picks the screens on a cheap Linux runner, so the Mac only starts when there is something to screenshot.
  plan:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.pick.outputs.ios }}
      ios_dark: ${{ steps.pick.outputs.ios_dark }}
      ios_charts: ${{ steps.pick.outputs.ios_charts }}
      any_ios: ${{ steps.pick.outputs.any_ios }}
      staff: ${{ steps.pick.outputs.staff }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: pick
        uses: ./.github/actions/pick-screens
        with:
          manual: ${{ inputs.screens }}

  screenshots:
    needs: plan
    if: needs.plan.outputs.any_ios == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      # Builds live outside the checkout (which is wiped each job), in the runner's own work folder, so a job only
      # recompiles what changed.
      DERIVED: ${{ github.workspace }}/../derived
    steps:
      - uses: actions/checkout@v4
      - name: Use the full Xcode, not the Command Line Tools
        run: |
          if [ -d /Applications/Xcode.app ]; then echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else echo "::error::Xcode isn't installed on this Mac (only the Command Line Tools, which have no simulator). Install Xcode from the App Store."; exit 1; fi
      - name: Install XcodeGen (once; the Mac keeps it)
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Make sure Xcode has the watchOS platform (the iPhone app carries the watch app)
        run: ios/scripts/ensure_watchos.sh
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodegen
          xcodebuild -project BayCountyMe.xcodeproj -scheme BayCountyMe \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Screenshot the picked screens, light and dark
        working-directory: ios
        env:
          LIGHT: ${{ needs.plan.outputs.ios }}
          DARK: ${{ needs.plan.outputs.ios_dark }}
          CHARTS: ${{ needs.plan.outputs.ios_charts }}
        run: |
          . scripts/ci_sim.sh
          DEV=$(ci_device); echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          APP=$(find "$DERIVED/Build/Products" -name "BayCountyMe.app" -maxdepth 3 | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          # shot <file name> <screen> [more launch arguments]. "home:rent" is the Home tab for a renter, "setup" the
          # first-launch setup screen; anything else opens with -screen (an "_" in the name stands for a space).
          shot() {
            n=$1; s=$2; shift 2
            xcrun simctl terminate "$DEV" me.baycounty.app 2>/dev/null || true
            case "$s" in
              home) xcrun simctl launch "$DEV" me.baycounty.app -setupSeen YES -tenure own ;;
              home:*) xcrun simctl launch "$DEV" me.baycounty.app -setupSeen YES -tenure "${s#home:}" ;;
              setup) xcrun simctl launch "$DEV" me.baycounty.app -setupSeen NO ;;
              *) xcrun simctl launch "$DEV" me.baycounty.app -screen "${s//_/ }" "$@" ;;
            esac
            ci_shot "$DEV" "shots/$n.png"
          }
          name() { echo "$1" | tr ':' '_'; }
          xcrun simctl ui "$DEV" appearance light
          for s in $LIGHT; do shot "$(name "$s")" "$s"; done
          xcrun simctl ui "$DEV" appearance dark
          for s in $DARK; do shot "$(name "$s")_dark" "$s"; done
          # Each chart, scrolled into view, in light and dark mode.
          for mode in light dark; do
            xcrun simctl ui "$DEV" appearance "$mode"
            for s in $CHARTS; do shot "chart_${s}_${mode}" "$s" -scrollTo chart; done
          done
      - name: Shut down the simulator
        if: always()
        run: '[ -z "$DEV" ] || xcrun simctl shutdown "$DEV" || true'
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/shots

  # BayCounty.me Staff, from its made-up demo data (-demo): the owner's view and a city alert sender's view.
  staff:
    needs: plan
    if: needs.plan.outputs.staff == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      # Builds live outside the checkout (which is wiped each job), in the runner's own work folder, so a job only
      # recompiles what changed.
      DERIVED: ${{ github.workspace }}/../derived
    steps:
      - uses: actions/checkout@v4
      - name: Use the full Xcode, not the Command Line Tools
        run: |
          if [ -d /Applications/Xcode.app ]; then echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else echo "::error::Xcode isn't installed on this Mac (only the Command Line Tools, which have no simulator). Install Xcode from the App Store."; exit 1; fi
      - name: Install XcodeGen (once; the Mac keeps it)
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Make sure Xcode has the watchOS platform (the iPhone app carries the watch app)
        run: ios/scripts/ensure_watchos.sh
      - name: Build the staff app for the simulator
        working-directory: ios
        run: |
          xcodegen
          xcodebuild -project BayCountyMe.xcodeproj -scheme BayCountyStaff -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Screenshot each screen, light and dark
        working-directory: ios
        run: |
          . scripts/ci_sim.sh
          DEV=$(ci_device); echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          APP=$(find "$DERIVED/Build/Products" -name "BayCountyStaff.app" -maxdepth 3 | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p staff-shots
          shot() {  # name, then launch arguments
            n=$1; shift
            xcrun simctl terminate "$DEV" me.baycounty.staff 2>/dev/null || true
            xcrun simctl launch "$DEV" me.baycounty.staff -demo "$@"
            CI_SHOT_MIN=2 ci_shot "$DEV" "staff-shots/$n.png"
          }
          for mode in light dark; do
            xcrun simctl ui "$DEV" appearance "$mode"
            shot "owner-overview_$mode" -screen overview
            shot "owner-flags_$mode" -screen flags
            shot "owner-flag_$mode" -screen flag
            shot "city-home_$mode" -asStaff -screen home
            shot "city-alerts_$mode" -asStaff -screen alerts
            shot "city-alert_$mode" -asStaff -screen alert
            shot "city-send_$mode" -asStaff -screen send
            shot "city-notices_$mode" -asStaff -screen notices
            shot "city-notice_$mode" -asStaff -screen notice
            shot "city-records_$mode" -asStaff -screen records
            shot "city-send-file_$mode" -asStaff -screen send-file
            shot "city-send-file-preview_$mode" -asStaff -screen send-file-preview
            shot "more_$mode" -screen more
            shot "official-board_$mode" -asOfficial -screen board
            shot "official-votes_$mode" -asOfficial -screen votes
          done
          xcrun simctl ui "$DEV" appearance light
          shot signin -screen signin
          shot signin-code -screen signin-code
          shot locked -screen locked
          xcrun simctl uninstall "$DEV" me.baycounty.staff || true
      - uses: actions/upload-artifact@v4
        with:
          name: staff-screenshots
          path: ios/staff-shots
