name: iOS screenshots
# Runs the app in the iPhone simulator and screenshots each main screen, so changes can be checked by eye.
on:
  workflow_dispatch:
  pull_request:
    paths: ["ios/BayCountyMe/**"]
jobs:
  screenshots:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the full Xcode, not the Command Line Tools
        run: |
          if [ -d /Applications/Xcode.app ]; then echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else echo "::error::Xcode isn't installed on this Mac (only the Command Line Tools, which have no simulator). Install Xcode from the App Store."; exit 1; fi
      - run: brew install xcodegen
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodegen
          xcodebuild -project BayCountyMe.xcodeproj -scheme BayCountyMe -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Screenshot each screen
        working-directory: ios
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl shutdown all || true  # the Mac Pro keeps simulators between runs
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance light
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          APP=$(find build/Build/Products -name "BayCountyMe.app" -maxdepth 3 | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          for s in home myhome myhome:settings "address:825 Ohio Ave" tax amendment3 glossary vendors vendor people person moneymap donors contracts votes salaries accountability accproject cra craincrement chambers events beaches parks roads development schools emergency hurricaneprep "utilities:825 Ohio Ave" restaurants restaurant newbusinesses volunteer military publicsafety overlaps budget pastelections updates tab:living tab:governments gov:county gov:lh tab:money tab:meetings tab:search record:contract record:vote record:board record:nonprofit; do
            xcrun simctl terminate "$DEV" me.baycounty.app 2>/dev/null || true
            if [ "$s" = home ]; then xcrun simctl launch "$DEV" me.baycounty.app; else xcrun simctl launch "$DEV" me.baycounty.app -screen "$s"; fi
            sleep 14
            xcrun simctl io "$DEV" screenshot "shots/$(echo "$s" | tr ': ' '__').png"
          done
          xcrun simctl ui "$DEV" appearance dark
          for s in home myhome tab:living tab:governments tab:money tab:meetings gov:county person budget tax record:board; do
            xcrun simctl terminate "$DEV" me.baycounty.app 2>/dev/null || true
            if [ "$s" = home ]; then xcrun simctl launch "$DEV" me.baycounty.app; else xcrun simctl launch "$DEV" me.baycounty.app -screen "$s"; fi
            sleep 12
            xcrun simctl io "$DEV" screenshot "shots/$(echo "$s" | tr ': ' '__')_dark.png"
          done
          # Each chart, scrolled into view, in light and dark mode.
          for mode in light dark; do
            xcrun simctl ui "$DEV" appearance "$mode"
            for s in craincrement cra budget vendor person tax contracts schools publicsafety overlaps; do
              xcrun simctl terminate "$DEV" me.baycounty.app 2>/dev/null || true
              xcrun simctl launch "$DEV" me.baycounty.app -screen "$s" -scrollTo chart
              sleep 16
              xcrun simctl io "$DEV" screenshot "shots/chart_${s}_${mode}.png"
            done
          done
      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown all || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/shots
