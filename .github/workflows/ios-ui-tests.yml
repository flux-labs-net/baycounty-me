name: iOS UI tests
# Runs the app in the iPhone simulator and taps through it (BayCountyMeUITests).
on:
  workflow_dispatch:
  pull_request:
    paths: ["ios/BayCountyMe/**", "ios/BayCountyMeUITests/**", "ios/project.yml", ".github/workflows/ios-ui-tests.yml"]
# One Mac runs every iOS job one at a time, so a new push to a pull request cancels that PR's older run
# instead of queuing behind it. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ui-tests:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the full Xcode, not the Command Line Tools
        run: |
          if [ -d /Applications/Xcode.app ]; then echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          else echo "::error::Xcode isn't installed on this Mac (only the Command Line Tools, which have no simulator). Install Xcode from the App Store."; exit 1; fi
      - run: brew install xcodegen
      - name: Run the UI tests
        working-directory: ios
        run: |
          xcodegen
          rm -rf /tmp/ui-shots; xcrun simctl shutdown all || true  # the Mac Pro keeps both between runs
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          # Show the on-screen keyboard (the number pad tests need it), not the Mac keyboard.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          set -o pipefail
          xcodebuild -project BayCountyMe.xcodeproj -scheme BayCountyMe -destination "id=$DEV" \
            -only-testing:BayCountyMeUITests CODE_SIGNING_ALLOWED=NO test | tee test.log | grep -E "error:|Test Case|passed|failed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown all || true
      - name: Upload screenshots taken by the tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: /tmp/ui-shots
          if-no-files-found: ignore
