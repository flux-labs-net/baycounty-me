name: Pick app screens
description: >-
  Picks which app screens to screenshot (.github/scripts/app_screens.py): the screens a pull request changed,
  a "Screens:" line in its description, everything for the all-screens label, or a manual run's list.
inputs:
  manual:
    description: A manual run's screens input ("all", "none" or names). Leave empty on pull requests and pushes.
    default: ""
outputs:
  ios: {description: iOS screens, light, space-separated, value: "${{ steps.pick.outputs.ios }}"}
  ios_dark: {description: iOS screens, dark, value: "${{ steps.pick.outputs.ios_dark }}"}
  ios_charts: {description: iOS screens whose chart is scrolled into view, value: "${{ steps.pick.outputs.ios_charts }}"}
  android: {description: Android JVM (Paparazzi) screens, comma-separated, value: "${{ steps.pick.outputs.android }}"}
  android_emu: {description: Android emulator screens, light, value: "${{ steps.pick.outputs.android_emu }}"}
  android_emu_dark: {description: Android emulator screens, dark, value: "${{ steps.pick.outputs.android_emu_dark }}"}
  any_ios: {description: true when there is an iOS screen to take, value: "${{ steps.pick.outputs.any_ios }}"}
  any_android: {description: true when there is an Android screen to take, value: "${{ steps.pick.outputs.any_android }}"}
  any_android_emu: {description: true when there is an emulator screen to take, value: "${{ steps.pick.outputs.any_android_emu }}"}
  staff: {description: true when the staff app's screens are wanted, value: "${{ steps.pick.outputs.staff }}"}
  watch: {description: true when the watch apps' screens are wanted, value: "${{ steps.pick.outputs.watch }}"}
runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        BEFORE: ${{ github.event.before }}
        MANUAL_SCREENS: ${{ inputs.manual }}
      run: |
        : > "$RUNNER_TEMP/files.txt"
        if [ -n "$PR_NUMBER" ]; then
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
        elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
          gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' > "$RUNNER_TEMP/files.txt"
        fi
        python3 "$GITHUB_WORKSPACE/.github/scripts/app_screens.py" --files "$RUNNER_TEMP/files.txt"
